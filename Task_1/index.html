
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate | Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="calculator-container">

        <div class="calculator">

            <div class="top-bar">
                <div class="brand">
                    <span class="brand-icon">✳</span>
                    <span>calculate.</span>
                </div>
                <span class="mode">STANDARD</span>
            </div>

            <div class="display">
                <div class="history" id="history">Ready to calculate</div>
                <div class="result" id="result">0</div>
                <div class="preview" id="preview"></div>
            </div>

            <div class="buttons">

                <button class="special" data-action="clear">AC</button>
                <button class="special" data-action="delete">DEL</button>
                <button class="special" data-action="percent">%</button>
                <button class="operator" data-operator="÷">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operator="×">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operator="−">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operator="+">+</button>

                <button class="special" data-action="sign">+/−</button>
                <button data-number="0">0</button>
                <button data-action="decimal">.</button>
                <button class="equal" data-action="calculate">=</button>

            </div>

            <div class="calculator-footer">
                <span>Simple calculations, made easy.</span>
                <span>© 2026</span>
            </div>

        </div>

        <p class="keyboard-note">
            TIP: You can also use your keyboard to calculate.
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
